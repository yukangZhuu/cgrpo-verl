# CGRPO Trainer Configuration
# Supports both standard GRPO (guidance_mode=none) and
# static-mixture curriculum (guidance_mode=prefix or hint).

defaults:
  - ppo_trainer
  - _self_

# Data Configuration
data:
  train_files: ${oc.env:HOME}/data/teacher_traces/train.jsonl
  val_files: ${oc.env:HOME}/data/teacher_traces/test.jsonl
  train_batch_size: 512
  max_prompt_length: 1024
  max_response_length: 4096

  # Guidance mode: "none" (standard GRPO), "prefix", or "hint"
  guidance_mode: "none"

  # Thinking/Answer format tags
  thinking_start: "<think>"
  thinking_end: "</think>"

  # Dataset settings
  use_chat_template: true
  filter_overlong_prompts: true
  truncation: "error"

# Algorithm Configuration
algorithm:
  adv_estimator: grpo
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true

# Actor-Rollout-Reference Configuration
actor_rollout_ref:
  model:
    path: Qwen/Qwen3-1.7B
    use_remove_padding: true
    enable_gradient_checkpointing: true

  actor:
    strategy: fsdp
    optim:
      lr: 5e-7
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    loss_agg_mode: token-mean

    fsdp_config:
      param_offload: true
      optimizer_offload: true

  rollout:
    name: vllm
    mode: async
    temperature: 1.0
    top_p: 0.95
    n: 8
    log_prob_micro_batch_size_per_gpu: 16
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.45
    prompt_length: 1024
    response_length: 4096

    agent:
      num_workers: 1
      default_agent_loop: curriculum_agent

  ref:
    log_prob_micro_batch_size_per_gpu: 16
    fsdp_config:
      param_offload: true

# Reward Model Configuration
reward_model:
  enable: false
  use_reward_loop: false
  num_examine: 0
  format_score: 0.0
  correct_score: 1.0
  overlong_buffer_enable: false
  overlong_buffer_len: 1024
  overlong_penalty_factor: 1.0

# Trainer Configuration
trainer:
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 3
  save_freq: 50
  test_freq: 20
  val_before_train: true
  logger: '["console","wandb"]'
  project_name: "cgrpo"
  experiment_name: "cgrpo_experiment"
  default_local_dir: "./checkpoints/cgrpo"

  # Metrics tracker
  ema_alpha: 0.1

  # Debug dump settings
  debug_dump_freq: 20
  debug_dump_dir: "./debug_samples"
  debug_dump_num_samples: 10
